[package]
name = "primitives"
version = "0.2.0"
authors = ["Oleksandr Mykhailenko <armyhaylenko@gmail.com>"]
license = "Unlicense"
publish = false
edition = "2021"

[dependencies]
sp-application-crypto = { version = "6.0.0", git = "https://github.com/paritytech/substrate.git", branch = "polkadot-v0.9.30", default-features = false  }
scale-info = { version = "2.0.1", default-features = false, features = ["derive"] }
codec = { package = "parity-scale-codec", version = "3.0.0", default-features = false }
sp-core = { version = "6.0.0", git = "https://github.com/paritytech/substrate.git", branch = "polkadot-v0.9.30", default-features = false }
frame-system = { version = "4.0.0-dev", git = "https://github.com/paritytech/substrate.git", branch = "polkadot-v0.9.30", default-features = false }
sp-runtime = { version = "6.0.0", git = "https://github.com/paritytech/substrate.git", branch = "polkadot-v0.9.30", default-features = false  }
sp-api = { git = "https://github.com/paritytech/substrate", default-features = false, branch = "polkadot-v0.9.30" }

[features]
default = [ "std" ]
std = [
	"sp-application-crypto/std",
	"scale-info/std",
	"codec/std",
	"sp-core/std",
	"frame-system/std",
	"sp-runtime/std",
	"sp-api/std"
]
